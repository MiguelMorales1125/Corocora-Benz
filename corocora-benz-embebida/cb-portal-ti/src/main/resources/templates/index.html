<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mesa de ayuda · Corocora Benz</title>
<style>body{font:16px/1.5 system-ui;margin:0;background:#f3f6f8;color:#182634}header{background:#182634;color:white;padding:1rem max(1rem,calc((100% - 1050px)/2))}main{max-width:1050px;margin:auto;padding:2rem 1rem}h1,h2{line-height:1.2}section{background:white;border:1px solid #d5dfe5;border-radius:10px;padding:1.5rem;margin:1rem 0}form,.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem}label{display:grid;gap:.3rem;font-weight:600}input,select,textarea,button{font:inherit;padding:.65rem;border:1px solid #9aadb9;border-radius:5px}button{background:#075d72;color:white;border:0;cursor:pointer;min-height:44px}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #d58c1d}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:.6rem;border-bottom:1px solid #d5dfe5}#message{white-space:pre-wrap} .wide{grid-column:1/-1}.scroll{overflow:auto}</style></head>
<body><header><strong>Corocora Benz</strong> / Mesa de ayuda</header><main><h1>Incidentes de TI</h1><p>Reporta un incidente y consulta el avance con tu identificador de usuario. En la demostración revisa este portal: el correo solo se envía si se configura SMTP.</p><p id="message" role="status" aria-live="polite"></p>
<section><h2>Reportar incidente</h2><form id="report"><label>Correo para notificaciones (opcional)<input name="notificationEmail" type="email" maxlength="255"></label><label>Sistema afectado<select name="systemName" required><option>Software del vehículo</option><option>ERP</option><option>Portal de clientes</option><option>Correo</option></select></label><label class="wide">Descripción<textarea name="description" required maxlength="4000"></textarea></label><label>Impacto<select name="impact"><option>Bajo</option><option selected>Medio</option><option>Alto</option></select></label><label>Urgencia<select name="urgency"><option>Baja</option><option selected>Media</option><option>Alta</option></select></label><label>Equipos afectados<input name="affectedTeams" type="number" min="1" value="1" required></label><label><span>¿Afecta la seguridad?</span><input name="safetyImpact" type="checkbox"></label><button type="submit">Enviar reporte</button></form></section>
<section><h2>Mis tickets</h2><button id="lookup" type="button">Consultar</button><div class="scroll"><table><thead><tr><th>Ticket</th><th>Sistema</th><th>Estado</th><th>Solución</th><th>Acción</th></tr></thead><tbody id="tickets"></tbody></table></div></section></main>
<script th:inline="javascript">const engine = /*[[${engineRest}]]*/ 'http://localhost:9000/engine-rest';</script><script src="/auth.js"></script><script th:inline="none">
const msg=document.querySelector('#message');function show(e){msg.textContent=typeof e==='string'?e:e.message||'No fue posible completar la operación.'}
async function load(){const tickets=await CB.request('/ti/tickets');const body=document.querySelector('#tickets');body.replaceChildren();for(const t of tickets){const row=body.insertRow();for(const value of [t.ticketId,t.systemName,t.status,t.resolutionSummary||'Pendiente'])row.insertCell().textContent=value||'—';const cell=row.insertCell();if(t.canConfirm)for(const [label,confirmed] of [['Confirmar solución',true],['No se resolvió',false]]){const button=document.createElement('button');button.type='button';button.textContent=label;button.onclick=async()=>{button.disabled=true;try{await CB.post('/ti/tickets/'+encodeURIComponent(t.ticketId)+'/confirm',{confirmed});show('Respuesta registrada.');await load()}catch(e){show(e);button.disabled=false}};cell.append(button)}}}
document.querySelector('#report').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target),data=Object.fromEntries(f);data.safetyImpact=f.has('safetyImpact');data.affectedTeams=Number(data.affectedTeams);const button=e.target.querySelector('button');button.disabled=true;try{const result=await CB.post('/ti/reports',data);show('Reporte enviado: '+result.businessKey+'. Consulta tus tickets en unos momentos.');setTimeout(()=>load().catch(()=>{}),1500)}catch(err){show(err)}finally{button.disabled=false}});
document.querySelector('#lookup').addEventListener('click',()=>load().catch(show));window.addEventListener('cb-auth-ready',e=>{if(!e.detail.cliente)load().catch(show)});
</script></body></html>
