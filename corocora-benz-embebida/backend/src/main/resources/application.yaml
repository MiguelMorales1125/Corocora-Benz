server:
  port: 8080

spring:
  application:
    name: corocora-benz-embebida
  datasource:
    url: jdbc:h2:mem:corocora;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

camunda.bpm.admin-user:
  id: demo
  password: demo
camunda.bpm.filter:
  create: All tasks
camunda.bpm.generic-properties.properties:
  userResourceWhitelistPattern: "[a-zA-Z0-9]+|USR-01"
camunda.bpm.database:
  schema-update: true
camunda.bpm.history-level: full
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
